<!DOCTYPE html>
<html lang="ar" dir="rtl"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style-home.css">
    <link rel="stylesheet" href="header.css"> 
    <title>aymantec - رفع التكليف</title>
    <style>
        .subject-badge {
            background: #e8f5e9;
            color: #048853;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin-top: 10px;
            border: 1px solid #c8e6c9;
        }
        
        .file-upload-wrapper {
            position: relative;
            width: 100%;
        }

        .custom-file-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px;
            background-color: #f8f9fa;
            border: 2px dashed #ccd1d9;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            color: #555;
        }

        .custom-file-label:hover {
            border-color: #048853;
            background-color: #f1f8f5;
            color: #048853;
        }

        #file-name-display {
            font-size: 13px;
            color: #048853;
            margin-top: 10px;
            font-weight: bold;
            word-break: break-all;
        }

        .status-container {
            text-align: center;
            margin-top: 20px;
        }

        /* تنسيق حقل الملاحظات */
        textarea#student-note {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd1d9;
            border-radius: 12px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            background-color: #fff;
            transition: 0.3s;
        }

        textarea#student-note:focus {
            border-color: #048853;
            outline: none;
            box-shadow: 0 0 5px rgba(4, 136, 83, 0.1);
        }

        /* إخفاء زر المتصفح الأصلي تماماً */
        #file-upload {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="content">
        <div class="login-card" id="upload-container">
            <div class="card-header">
                <div class="icon-circle">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <h3>تسليم التكليف</h3>
                <div class="subject-badge">
                    <i class="fas fa-book"></i> <span id="display-subject"></span>
                </div>
            </div>
            
            <div class="form-body">
                <div class="input-group">
                    <label><i class="fas fa-user-edit"></i> اسم الطالب الرباعي</label>
                    <input type="text" id="student-name" placeholder="أدخل اسمك كما هو في الكشف">
                </div>

                <div class="input-group">
                    <label><i class="fas fa-file-alt"></i> ملف التكليف</label>
                    <div class="file-upload-wrapper">
                        <label for="file-upload" class="custom-file-label">
                            <i class="fas fa-paperclip"></i>
                            <span id="file-btn-text">اضغط هنا لإرفاق الملف</span>
                        </label>
                        <input type="file" id="file-upload" onchange="updateFileName()" 
                               accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                    </div>
                    <div id="file-name-display"></div>
                </div>

                <div class="input-group">
                    <label><i class="fas fa-comment-dots"></i> ملاحظة </label>
                    <textarea id="student-note" placeholder="أضف أي توضيح بخصوص التكليف هنا..."></textarea>
                </div>

                <button class="login-btn" id="submit-btn" onclick="submitAssignment()">
                    إرسال التكليف <i class="fas fa-paper-plane"></i>
                </button>
                
                <div id="status-message" class="status-container"></div>
            </div>
        </div>
    </main>

    <script>
        const selectedSubject = localStorage.getItem("subject") || "لم يتم اختيار مادة";
        document.getElementById("display-subject").textContent = selectedSubject;

        function updateFileName() {
            const fileInput = document.getElementById('file-upload');
            const fileNameDisplay = document.getElementById('file-name-display');
            const btnText = document.getElementById('file-btn-text');
            
            if (fileInput.files.length > 0) {
                fileNameDisplay.innerHTML = `<i class="fas fa-check-circle"></i> الملف المختار: ${fileInput.files[0].name}`;
                btnText.textContent = "تغيير الملف";
            }
        }

        function submitAssignment() {
            const name = document.getElementById("student-name").value.trim();
            const fileInput = document.getElementById("file-upload");
            const note = document.getElementById("student-note").value.trim();
            const status = document.getElementById("status-message");
            const submitBtn = document.getElementById("submit-btn");

            // 1. التأكد من إدخال البيانات الأساسية
            if (name === "" || fileInput.files.length === 0) {
                status.innerHTML = "<span style='color:red; font-size:14px;'> يرجى كتابة اسمك وإرفاق الملف</span>";
                return;
            }

            // 2. فحص نوع الملف (حماية أولية)
            const allowedExtensions = /(\.pdf|\.doc|\.docx|\.jpg|\.jpeg|\.png)$/i;
            if (!allowedExtensions.exec(fileInput.files[0].name)) {
                status.innerHTML = "<span style='color:red;'>نوع الملف غير مسموح! (PDF, Word, صور فقط)</span>";
                return;
            }

            // 3. فحص حجم الملف (أقصى حد 10 ميجا)
            if (fileInput.files[0].size > 10 * 1024 * 1024) {
                status.innerHTML = "<span style='color:red;'>حجم الملف كبير جداً (الأقصى 10MB)</span>";
                return;
            }

            status.innerHTML = "<span style='color:#048853;'> جاري الرفع.. انتظر لحظة</span>";
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";

            const formData = new FormData();
            formData.append('studentName', name);
            formData.append('subjectSelect', selectedSubject);
            formData.append('assignmentFile', fileInput.files[0]);
            formData.append('studentNote', note);

            fetch('upload_process.php', { method: 'POST', body: formData })
            .then(response => response.text())
            .then(data => {
                if(data.trim() === "success") {
                    document.getElementById("upload-container").innerHTML = `
                        <div class="card-header" style="background: #f0fdf4; padding: 40px;">
                            <i class="fas fa-check-circle" style="font-size: 50px; color: #28a745;"></i>
                            <h2 style="color: #28a745; margin-top:15px;">تم الإرسال بنجاح!</h2>
                            <p style="margin-top:10px;">تم استلام تكليف مادة: <br><strong>${selectedSubject}</strong></p>
                        </div>
                        <div class="form-body">
                            <a href="index.html" style="display:block; text-align:center; margin-top:20px; color:#666; text-decoration:none;">
                                <i class="fas fa-home"></i> العودة للرئيسية
                            </a>
                        </div>
                    `;
                } else {
                    status.innerHTML = "<span style='color:red;'> خطأ: " + data + "</span>";
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = "1";
                }
            })
            .catch(error => {
                status.innerHTML = "<span style='color:red;'> فشل الاتصال بالسيرفر</span>";
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
            });
        }
    </script>
    <script src="header.js"></script>
</body>
</html>
